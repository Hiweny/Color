.page2 .page-bg{opacity:.78;filter:blur(94px)}.deck-stage{position:relative;min-height:0;display:grid;place-items:center;overflow:hidden}.deck{position:relative;width:min(720px,96vw);height:min(77svh,760px);perspective:1300px}.deck-card{position:absolute;top:2%;left:50%;height:96%;width:24%;min-width:108px;overflow:hidden;border:1px solid rgba(255,255,255,.18);border-radius:4px;box-shadow:0 24px 48px rgba(0,0,0,.23);cursor:pointer;transform-origin:50% 88%;transition:transform .75s var(--ease),filter .4s ease,box-shadow .5s ease;will-change:transform}.deck-card:after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);pointer-events:none}.deck-card .surface{position:absolute;inset:0;background:var(--gradient)}.deck-card .sheen{position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,255,255,.1),transparent 18%,transparent 82%,rgba(0,0,0,.12))}.deck-card .hex{position:absolute;z-index:3;left:11px;right:11px;font:600 9px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.09em;text-shadow:0 2px 10px rgba(0,0,0,.22)}.deck-card .hex.top{top:15px}.deck-card .hex.bottom{bottom:15px}.deck-card .name{position:absolute;z-index:3;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-90deg);white-space:nowrap;font-family:"Iowan Old Style","Baskerville",serif;font-size:clamp(24px,6.1vw,41px);font-weight:650;letter-spacing:-.035em;text-shadow:0 4px 20px rgba(0,0,0,.16)}.deck-card .line{position:absolute;z-index:3;left:50%;top:27%;width:1px;height:14%;background:currentColor;opacity:.62;transform:translateX(-50%)}.deck-card .line.bottom{top:auto;bottom:27%}.deck-card .stop-list{position:absolute;z-index:3;top:43%;left:7px;right:7px;display:flex;flex-direction:column;align-items:center;gap:7px}.deck-card .stop-list span{font:8px ui-monospace,monospace;letter-spacing:.05em;text-shadow:0 2px 8px rgba(0,0,0,.22)}.deck-card:nth-child(1){transform:translateX(-35%) rotate(-1.4deg);z-index:4}.deck-card:nth-child(2){transform:translate ;display:flex;gap:8px}.dot{width:5px;height:5px;padding:0;border:0;border-radius:50%;background:rgba(255,255,255,.23)}.dot.active{background:rgba(255,255,255,.9);transform:scale(1.35)}
@keyframes floatA{50%{transform:translate(26px,38px) rotate(20deg)}}@keyframes floatB{50%{transform:translate(-21px,30px) rotate(80deg)}}@keyframes floatC{50%{transform:translate(-28px,-32px) scale(1.06)}}@keyframes twinkle{0%,100%{opacity:.46;transform:scale(.92) rotate(0)}50%{opacity:1;transform:scale(1.1) rotate(13deg)}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes spinReverse{to{transform:rotate(-360deg)}}
@media(max-width:420px){.hero-inner{transform:translateY(-2vh)}.color-bar{margin-top:58px}.deck{height:75svh}.deck-card{width:25%;min-width:0}.deck.fanned .deck-card:nth-child(1){transform:translateX(-143%) rotate(-5deg)}.deck.fanned .deck-card:nth-child(2){transform:translateX(-48%) rotate(-1.8deg)}.deck.fanned .deck-card:nth-child(3){transform:translateX(48%) rotate(1.8deg)}.deck.fanned .deck-card:nth-child(4){transform:translateX(143%) rotate(5deg)}.deck-card .name{font-size:25px}.deck-card .hex{font-size:7px}.deck-card .stop-list span{font-size:7px}}

const FALLBACK=[
{name:'Warm Flame',index:'001',deg:45,gradient:[{color:'#ff9a9e',pos:0},{color:'#fad0c4',pos:100}]},{name:'Night Fade',index:'002',deg:0,gradient:[{color:'#a18cd1',pos:0},{color:'#fbc2eb',pos:100}]},{name:'Spring Warmth',index:'003',deg:0,gradient:[{color:'#fad0c4',pos:0},{color:'#ffd1ff',pos:100}]},{name:'Juicy Peach',index:'004',deg:90,gradient:[{color:'#ffecd2',pos:0},{color:'#fcb69f',pos:100}]},{name:'Young Passion',index:'005',deg:90,gradient:[{color:'#ff8177',pos:0},{color:'#ff8c7f',pos:21},{color:'#f99185',pos:52},{color:'#cf556c',pos:78},{color:'#b12a5b',pos:100}]},{name:'Sunny Morning',index:'007',deg:120,gradient:[{color:'#f6d365',pos:0},{color:'#fda085',pos:100}]},{name:'Winter Neva',index:'010',deg:120,gradient:[{color:'#a1c4fd',pos:0},{color:'#c2e9fb',pos:100}]},{name:'Tempting Azure',index:'012',deg:120,gradient:[{color:'#84fab0',pos:0},{color:'#8fd3f4',pos:100}]},{name:'Malibu Beach',index:'019',deg:0,gradient:[{color:'#4facfe',pos:0},{color:'#00f2fe',pos:100}]},{name:'Morpheus Den',index:'022',deg:0,gradient:[{color:'#30cfd0',pos:0},{color:'#330867',pos:100}]},{name:'Near Moon',index:'024',deg:0,gradient:[{color:'#5ee7df',pos:0},{color:'#b490ca',pos:100}]},{name:'Plum Plate',index:'028',deg:135,gradient:[{color:'#667eea',pos:0},{color:'#764ba2',pos:100}]},{name:'Happy Fisher',index:'030',deg:120,gradient:[{color:'#89f7fe',pos:0},{color:'#66a6ff',pos:100}]},{name:'Black Sea',index:'089',deg:135,gradient:[{color:'#2c3e50',pos:0},{color:'#4ca1af',pos:100}]},{name:'Azur Lane',index:'120',deg:135,gradient:[{color:'#5c6bc0',pos:0},{color:'#3949ab',pos:100}]}
];
let gradients=FALLBACK.slice(),current=null,apiEndpoint=null,apiBusy=false;const $=id=>document.getElementById(id);
function hexToRgb(hex){const h=hex.replace('#','');const n=parseInt(h,16);return[(n>>16)&255,(n>>8)&255,n&255]}
function rgbToHex(r,g,b){return '#'+[r,g,b].map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('').toUpperCase()}
function rgbToHsl([r,g,b]){r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b);let h=0,s=0,l=(mx+mn)/2;if(mx!==mn){const d=mx-mn;s=l>.5?d/(2-mx-mn):d/(mx+mn);switch(mx){case r:h=((g-b)/d+(g<b?6:0));break;case g:h=(b-r)/d+2;break;default:h=(r-g)/d+4}h*=60}return[h,s*100,l*100]}

function cssGradient(item){return 'linear-gradient('+item.deg+'deg,'+item.gradient.map(s=>s.color+' '+s.pos+'%').join(',')+')'}
function uniqueStops(item){const out=[];for(const s of item.gradient){if(!out.find(x=>x.color.toLowerCase()===s.color.toLowerCase()&&x.pos===s.pos))out.push(s)}return out}

function clone(v){return JSON.parse(JSON.stringify(v))}
function darken(hex,amount){const [r,g,b]=hexToRgb(hex);return rgbToHex(r*(1-amount),g*(1-amount),b*(1-amount))}

function bestText(colors){let best='#fff5ea',score=-1;for(const c of ['#fff5ea','#ffffff','#f7e8d0','#d7f6ff','#11151d']){let s=0;for(const col of colors)s+=contrast(c,col);if(s>score){score=s;best=c}}return best}

async function loadGradients(){try{const r=await fetch(WEBGRADIENTS_LOCAL,{cache:'no-store'});if(!r.ok)throw 0;const data=await r.json();if(Array.isArray(data)&&data.length)gradients=data;return}catch{}try{const r=await fetch(WEBGRADIENTS_REMOTE,{cache:'no-store'});if(!r.ok)throw 0;const data=await r.json();if(Array.isArray(data)&&data.length)gradients=data}catch{}}
function randomGradient(){return clone(gradients[Math.floor(Math.random()*gradients.length)])}
function makeHybrid(base){const matches=gradients.map(item=>({item,score:Math.min(...dominantColors(item).map(c=>dist(base,c)))})).sort((a,b)=>a.score-b.score).slice(0,8);const chosen=clone(matches[Math.floor(Math.random()*Math.min(4,matches.length))].item),cols=dominantColors(chosen),p=25+Math.floor(Math.random()*51),g=clone(chosen);g.name='Near '+(g.name||'Color');g.index='API';g.gradient=[{color:base,pos:p>50?0:50},{color:cols[0]||base,pos:p>50?p:100}].sort((x,y)=>x.pos-y.pos);return g}
async function discoverApiEndpoint(){if(apiEndpoint!==null)return apiEndpoint;try{const r=await fetch(API_DOC,{cache:'no-store'});const html=await r.text();const urls=[...html.matchAll(/https?:\/\/api\.shanhe\.kim[^\"'\s<]+/g)].map(m=>m[0]);const candidates=[...new Set(urls)].filter(u=>/random|color/i.test(u));apiEndpoint=candidates.find(u=>/random/i.test(u))||candidates[0]||null}catch{apiEndpoint=null}return apiEndpoint}
async function fetchApiColor(){if(apiBusy)return null;apiBusy=true;try{const ep=await discoverApiEndpoint();if(!ep)return null;const r=await fetch(ep,{cache:'no-store'});if(!r.ok)throw 0;const text=await r.text();const hex=(text.match(/#[0-9a-fA-F]{6}/)||[])[0];return hex?hex.toUpperCase():null}catch{return null}finally{apiBusy=false}}
function applyPalette(item,source='WebGradients'){current={...clone(item),source};const stops=uniqueStops(current),first=stops[0]?.color||'#ffffff';$('paletteIndex').textContent=(current.index||'—').toString().padStart(3,'0')+' / GRADIENT';$('paletteName').textContent=current.name||'Untitled';$('paletteLine').textContent=source==='Image'?'extracted from your image':source==='API'?'random color · matched':'a small study in color';$('heroHex').textContent=first.toUpperCase();$('colorBar').style.background=cssGradient(current);deriveTheme(current);renderDeck(current);updateFavoriteState()}
function renderDeck(hero){const stops=uniqueStops(hero).map(s=>s.color),base=hero.name||'Gradient',variants=[];for(let i=0;i<4;i++){let item=clone(hero);item.name=i===0?base:base+' '+(i+1);item.index='0'+(i+1);if(i===0)item.gradient=uniqueStops(hero);else if(i===1){item.deg=(hero.deg+45)%360;item.gradient=stops.slice().reverse().map((c,k)=>({color:c,pos:Math.round(k*100/Math.max(1,stops.length-1))}))}else if(i===2){item.deg=(hero.deg+90)%360;const arr=stops.slice();if(arr.length<3)arr.push(mix(arr[0]||'#fff',arr.at(-1)||'#000',.5));item.gradient=arr.map((c,k)=>({color:c,pos:Math.round(k*100/Math.max(1,arr.length-1))}))}else{item.deg=(hero.deg+135)%360;item.gradient=[{color:lighten(stops[0]||'#fff',.22),pos:0},{color:stops[Math.floor(stops.length/2)]||stops[0]||'#888',pos:48},{color:darken(stops.at(-1)||'#000',.2),pos:100}]}variants.push(item)}$('deck').innerHTML=variants.map((v,i)=>'<article class="deck-card" data-i="'+i+'" style="color:'+bestText(dominantColors(v))+'"><div class="surface" style="background:'+cssGradient(v)+'"></div><div class="sheen"></div><div class="hex top">'+(v.gradient[0]?.color||'').toUpperCase()+'</div><div class="line"></div><div class="stop-list">'+uniqueStops(v).slice(0,3).map(s=>'<span>'+s.color.toUpperCase()+'</span>').join('')+'</div><div class="name">Gradient '+(i+1)+'</div><div class="line bottom"></div><div class="hex bottom">'+(v.gradient.at(-1)?.color||'').toUpperCase()+'</div></article>').join('');document.querySelectorAll('.deck-card').forEach(card=>card.addEventListener('click',()=>{if(!$('deck').classList.contains('fanned')){$('deck').classList.add('fanned');return}const selected=variants[Number(card.dataset.i)];applyPalette(selected,'WebGradients');goPage(0)}))}
function mix(a,b,t){const x=hexToRgb(a),y=hexToRgb(b);return rgbToHex(x[0]*(1-t)+y[0]*t,x[1]*(1-t)+y[1]*t,x[2]*(1-t)+y[2]*t)}
function favoriteKey(item){return JSON.stringify(uniqueStops(item).map(s=>[s.color,s.pos]))+'|'+item.deg}
function getFavorites(){try{return JSON.parse(localStorage.getItem('color:favorites:v1'))||[]}catch{return[]}}
function saveFavorite(){const favs=getFavorites(),key=favoriteKey(current),idx=favs.findIndex(x=>favoriteKey(x)===key);if(idx>=0)favs.splice(idx,1);else{favs.unshift({...clone(current),savedAt:Date.now()});if(favs.length>60)favs.length=60}localStorage.setItem('color:favorites:v1',JSON.stringify(favs));updateFavoriteState();renderFavorites()}
function updateFavoriteState(){const on=getFavorites().some(x=>favoriteKey(x)===favoriteKey(current));$('saveBtn').classList.toggle('active',on);$('saveBtn').textContent=on?'♥':'♡'}
function renderFavorites(){const favs=getFavorites();$('favCount').textContent=favs.length+' SAVED';if(!favs.length){$('favGrid').innerHTML='<div class="fav-empty">Your saved palettes will live here.<br>Keep the ones that feel right.</div>';return}$('favGrid').innerHTML=favs.map((f,i)=>'<article class="fav-item" data-i="'+i+'"><div class="fav-gradient" style="background:'+cssGradient(f)+'"></div><div class="fav-code">'+(uniqueStops(f)[0]?.color||'').toUpperCase()+'</div><div class="fav-name">'+(f.name||'Untitled')+'</div><button class="fav-remove" data-remove="'+i+'">×</button></article>').join('');document.querySelectorAll('.fav-item').forEach(card=>card.addEventListener('click',e=>{if(e.target.dataset.remove!==undefined)return;const f=favs[Number(card.dataset.i)];applyPalette(f,f.source||'Saved');closeFavorites();goPage(0)}));document.querySelectorAll('.fav-remove').forEach(btn=>btn.addEventListener('click',e=>{e.stopPropagation();const f=getFavorites();f.splice(Number(btn.dataset.remove),1);localStorage.setItem('color:favorites:v1',JSON.stringify(f));renderFavorites();updateFavoriteState()}))}
function openFavorites(){renderFavorites();$('favoritesPanel').classList.add('open')}function closeFavorites(){$('favoritesPanel').classList.remove('open')}
async function extractImage(file){const url=URL.createObjectURL(file);try{const img=new Image();img.decoding='async';img.src=url;await img.decode();const scale=Math.min(1,220/Math.max(img.naturalWidth,img.naturalHeight)),w=Math.max(1,Math.round(img.naturalWidth*scale)),h=Math.max(1,Math.round(img.naturalHeight*scale)),canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;const ctx=canvas.getContext('2d',{willReadFrequently:true});ctx.drawImage(img,0,0,w,h);const data=ctx.getImageData(0,0,w,h).data,pixels=[];for(let i=0;i<data.length;i+=16){if(data[i+3]<180)continue;const r=data[i],g=data[i+1],b=data[i+2],mx=Math.max(r,g,b),mn=Math.min(r,g,b);if(mx<18&&mn<18)continue;if(mx>248&&mn>248)continue;pixels.push([r,g,b])}const k=6;let centers=[];for(let i=0;i<k;i++)centers.push(pixels[Math.floor(Math.random()*pixels.length)]||[128,128,128]);for(let iter=0;iter<10;iter++){const sums=Array.from({length:k},()=>[0,0,0,0]);for(const p of pixels){let bi=0,bd=1e9;for(let j=0;j<k;j++){const c=centers[j],d=(p[0]-c[0])**2+(p[1]-c[1])**2+(p[2]-c[2])**2;if(d<bd){bd=d;bi=j}}sums[bi][0]+=p[0];sums[bi][1]+=p[1];sums[bi][2]+=p[2];sums[bi][3]++}centers=sums.map((s,i)=>s[3]?[s[0]/s[3],s[1]/s[3],s[2]/s[3]]:centers[i])}const weighted=centers.map(c=>({c,n:pixels.filter(p=>(p[0]-c[0])**2+(p[1]-c[1])**2+(p[2]-c[2])**2<6500).length})).sort((a,b)=>b.n-a.n),cols=[];for(const x of weighted){const hex=rgbToHex(...x.c);if(cols.every(c=>dist(c,hex)>35))cols.push(hex);if(cols.length>=5)break}if(cols.length<2)cols.push('#6f7d91');const ordered=cols.map(c=>({c,h:rgbToHsl(hexToRgb(c))})).sort((a,b)=>a.h[2]-b.h[2]).map(x=>x.c),item={name:'Image Study',index:'IMG',deg:90,gradient:ordered.map((c,i)=>({color:c,pos:Math.round(i*100/Math.max(1,ordered.length-1))}))};applyPalette(item,'Image');goPage(0)}finally{URL.revokeObjectURL(url)}}
function randomize(){const useApi=Math.random()<.42;if(useApi)fetchApiColor().then(hex=>{if(hex)applyPalette(makeHybrid(hex),'API');else applyPalette(randomGradient(),'WebGradients')});else applyPalette(randomGradient(),'WebGradients')}
function goPage(i){$('viewport').scrollTo({left:i*innerWidth,behavior:'smooth'});if(i===1)$('deck').classList.remove('fanned')}
$('saveBtn').addEventListener('click',()=>{if(current)saveFavorite()});$('saveBtn').addEventListener('dblclick',openFavorites);$('imageBtn').addEventListener('click',()=>$('imageInput').click());$('imageInput').addEventListener('change',e=>{const f=e.target.files?.[0];if(f)extractImage(f);e.target.value='' });$('shuffleBtn').addEventListener('click',randomize);$('page2Shuffle').addEventListener('click',randomize);$('drawerRandom').addEventListener('click',randomize);$('paletteBtn').addEventListener('click',()=>goPage(1));$('gradientBtn').addEventListener('click',()=>goPage(1));$('backBtn').addEventListener('click',()=>goPage(0));$('drawerMix').addEventListener('click',()=>applyPalette({...randomGradient(),name:'Mixed '+randomGradient().name},'WebGradients'));$('favClose').addEventListener('click',closeFavorites);$('favBackdrop').addEventListener('click',closeFavorites);document.querySelectorAll('.dot').forEach(d=>d.addEventListener('click',()=>goPage(Number(d.dataset.page))));$('viewport').addEventListener('scroll',()=>{const i=Math.round($('viewport').scrollLeft/innerWidth);document.querySelectorAll('.dot').forEach((d,n)=>d.classList.toggle('active',n===i))},{passive:true});window.addEventListener('keydown',e=>{if(e.key===' '){e.preventDefault();randomize()}if(e.key.toLowerCase()==='f')openFavorites();if(e.key==='Escape')closeFavorites()});renderFavorites();loadGradients().then(()=>applyPalette(randomGradient(),'WebGradients'));
</script>
