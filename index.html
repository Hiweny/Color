<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>色 · Gradient Gallery</title>
<meta name="description" content="随机展示精美渐变配色 · 收藏 · 从图片提取配色">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23FF64A0'/%3E%3Cstop offset='1' stop-color='%2399E5FF'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='50' cy='50' r='46' fill='url(%23g)'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<!-- 背景氛围层 -->
<div class="bg">
  <div class="bg-orb bg-orb-1"></div>
  <div class="bg-orb bg-orb-2"></div>
  <div class="bg-grain"></div>
</div>

<!-- 顶部栏 -->
<header class="topbar">
  <div class="brand">
    <span class="brand-mark"></span>
    <span class="brand-name">色</span>
    <span class="brand-sub">GRADIENT&nbsp;·&nbsp;GALLERY</span>
  </div>
  <nav class="topnav">
    <button class="iconbtn" id="btn-auto" title="自动播放" aria-label="自动播放">
      <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    </button>
    <button class="iconbtn" id="btn-fav" title="我的收藏" aria-label="收藏">
      <svg viewBox="0 0 24 24"><path d="M12 21s-6.7-4.35-9.33-8.11C.9 10.3 1.6 6.6 4.6 5.1a5.4 5.4 0 0 1 7.4 2.07A5.4 5.4 0 0 1 19.4 5.1c3 1.5 3.7 5.2 1.93 7.79C18.7 16.65 12 21 12 21z"/></svg>
      <span class="dot" id="fav-count"></span>
    </button>
    <button class="iconbtn" id="btn-upload" title="从图片提取配色" aria-label="上传图片">
      <svg viewBox="0 0 24 24"><path d="M12 16V4m0 0 4 4m-4-4-4 4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
    </button>
  </nav>
</header>

<!-- 主展示区 -->
<main class="stage" id="stage">

  <!-- 中央渐变艺术品 -->
  <section class="hero">
    <div class="hero-glow" id="heroGlow"></div>

    <div class="hero-art" id="heroArt">
      <!-- 交叉渐隐的渐变层 -->
      <div class="art-layer is-current" id="artLayerA"></div>
      <div class="art-layer" id="artLayerB"></div>
      <!-- 星群 -->
      <div class="stars" id="stars"></div>
      <!-- 装饰几何 -->
      <div class="art-deco deco-ring"></div>
      <div class="art-deco deco-dot"></div>
    </div>

    <!-- 签名渐变条 + 星星 -->
    <div class="gradbar-wrap">
      <div class="gradbar" id="gradBar">
        <div class="stars-line" id="starsLine"></div>
      </div>
    </div>

    <!-- 配色信息 -->
    <div class="palette" id="palette"></div>
  </section>

  <!-- 操作区 -->
  <section class="controls">
    <button class="ctrl-btn" id="btn-random">
      <span class="ctrl-ico">
        <svg viewBox="0 0 24 24"><path d="M4 4v7a4 4 0 0 0 4 4h12m0 0-3.5-3.5M20 15l-3.5 3.5M20 4v7a4 4 0 0 1-4 4"/></svg>
      </span>
      <span class="ctrl-txt">随机</span>
    </button>
    <button class="ctrl-btn ghost" id="btn-togglefav">
      <span class="ctrl-ico heart">
        <svg viewBox="0 0 24 24"><path d="M12 21s-6.7-4.35-9.33-8.11C.9 10.3 1.6 6.6 4.6 5.1a5.4 5.4 0 0 1 7.4 2.07A5.4 5.4 0 0 1 19.4 5.1c3 1.5 3.7 5.2 1.93 7.79C18.7 16.65 12 21 12 21z"/></svg>
      </span>
      <span class="ctrl-txt">收藏</span>
    </button>
    <button class="ctrl-btn ghost" id="btn-copy">
      <span class="ctrl-ico">
        <svg viewBox="0 0 24 24"><path d="M9 9h11v11H9zM5 15H4V4h11v1M4 4l13 13"/></svg>
      </span>
      <span class="ctrl-txt">复制CSS</span>
    </button>
  </section>

  <!-- 画廊：现成配色 -->
  <section class="gallery-wrap" id="galleryWrap">
    <div class="section-head">
      <span class="section-title">配色灵感库</span>
      <span class="section-meta" id="galleryMeta"></span>
    </div>
    <div class="gallery" id="gallery"></div>
  </section>

  <!-- 收藏视图 -->
  <section class="fav-wrap hidden" id="favWrap">
    <div class="section-head">
      <span class="section-title">我的收藏</span>
      <span class="section-meta" id="favMeta"></span>
    </div>
    <div class="gallery" id="favGallery"></div>
  </section>

</main>

<!-- 图片提色面板 -->
<div class="modal-mask hidden" id="uploadMask">
  <div class="modal">
    <div class="modal-head">
      <span class="section-title">从图片提取配色</span>
      <button class="iconbtn" id="btn-closeupload" aria-label="关闭">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>

    <div class="dropzone" id="dropzone">
      <input type="file" id="fileInput" accept="image/*" hidden>
      <svg viewBox="0 0 24 24" class="dz-ico"><path d="M12 16V4m0 0 4 4m-4-4-4 4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
      <p class="dz-txt">拖入一张图片，或点击选择</p>
      <p class="dz-sub">提取优雅的主色调并生成渐变</p>
    </div>

    <div class="extract-result hidden" id="extractResult">
      <div class="ex-top">
        <div class="ex-img"><img id="exThumb" alt="原图"></div>
        <div class="ex-info">
          <div class="swatches" id="exSwatches"></div>
        </div>
      </div>
      <div class="ex-bar" id="exBar"></div>
      <div class="ex-actions">
        <button class="ctrl-btn" id="btn-useextract">用这组配色</button>
        <button class="ctrl-btn ghost" id="btn-extract-again">再提取一次</button>
      </div>
    </div>
  </div>
</div>

<!-- 轻提示 -->
<div class="toast" id="toast"></div>

<script src="assets/data/gradients.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
