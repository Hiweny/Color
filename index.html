<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<title>Color</title>
<style>
:root{--ink:#f6f1e8;--line:rgba(255,255,255,.18);--ease:cubic-bezier(.22,1,.36,1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:#0d1117;color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif}body{overflow:hidden}button,input{font:inherit}button{color:inherit}
.ambient{position:fixed;inset:-12%;z-index:0;filter:blur(70px);opacity:.66;background:radial-gradient(circle at 20% 20%,var(--c1,#396386),transparent 33%),radial-gradient(circle at 85% 25%,var(--c2,#b3bcc0),transparent 30%),radial-gradient(circle at 52% 85%,var(--c3,#7e5b61),transparent 34%),linear-gradient(135deg,var(--c4,#063139),var(--c1,#396386));transition:background 1.1s var(--ease)}
.app{position:relative;z-index:1;min-height:100svh;display:grid;grid-template-rows:auto 1fr auto;padding:18px 18px max(18px,env(safe-area-inset-bottom))}.topbar,.bottom-bar{display:flex;align-items:center;justify-content:center;position:relative;z-index:4}.topbar{justify-content:space-between}.wordmark{background:transparent;border:0;padding:8px 0;font-size:15px;letter-spacing:.22em;font-weight:600;cursor:pointer}.wordmark span{margin-left:.15em;opacity:.55}.actions{display:flex;gap:8px}.icon-btn,.close-btn{border:1px solid var(--line);background:rgba(0,0,0,.12);backdrop-filter:blur(15px);width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:19px;cursor:pointer;transition:transform .25s var(--ease)}
.icon-btn:active,.close-btn:active,.shuffle:active,.pill:active,.swatch:active{transform:scale(.94)}
.gallery{position:relative;min-height:0;display:grid;place-items:center;overflow:hidden;border-radius:34px;margin:8px 0 14px;border:1px solid rgba(255,255,255,.10);background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.01));box-shadow:0 28px 80px rgba(0,0,0,.22)}.gallery.changing .specimen{animation:fadePop .55s var(--ease)}.specimen{position:relative;width:min(640px,88vw);text-align:center;padding:34px 18px 30px;z-index:2}.eyebrow{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.62)}h1{font-family:"Iowan Old Style","Baskerville","Times New Roman",serif;font-size:clamp(48px,11vw,88px);font-weight:500;line-height:.94;letter-spacing:-.045em;margin:16px 0 10px;text-wrap:balance;text-shadow:0 8px 28px rgba(0,0,0,.18)}.tagline{font-family:"Iowan Old Style","Songti SC",serif;font-size:15px;color:rgba(255,255,255,.66);letter-spacing:.05em}
.color-bar{position:relative;height:58px;margin:44px auto 28px;width:min(520px,86vw);border-radius:999px;border:1px solid rgba(255,255,255,.72);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 12px 50px rgba(0,0,0,.15);transition:background 1s var(--ease)}.color-bar:before,.color-bar:after{content:"";position:absolute;top:50%;width:40px;height:40px;transform:translate(-50%,-50%);border-radius:50%;border:1px solid rgba(255,255,255,.9);background:rgba(255,255,255,.08);backdrop-filter:blur(8px);box-shadow:0 0 0 6px rgba(255,255,255,.035)}.color-bar:before{left:0}.color-bar:after{left:100%}
.swatches{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:0 auto 26px;width:min(560px,90vw)}.swatch{aspect-ratio:1/1.12;border-radius:16px;position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.13);cursor:pointer;box-shadow:0 12px 26px rgba(0,0,0,.10);transition:transform .28s var(--ease)}.swatch .code{position:absolute;left:9px;right:9px;bottom:8px;font-size:9px;letter-spacing:.08em;color:var(--swatch-text,#fff);text-align:left;opacity:.94}.meta-row{display:flex;align-items:baseline;justify-content:center;gap:14px}.tiny{font-size:10px;letter-spacing:.22em;color:rgba(255,255,255,.52)}.meta-value{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;letter-spacing:.14em;color:rgba(255,255,255,.82)}
.shape{position:absolute;filter:blur(.1px);opacity:.6;mix-blend-mode:screen;will-change:transform}.shape-1{width:180px;height:180px;border-radius:42% 58% 63% 37%/41% 39% 61% 59%;background:linear-gradient(135deg,var(--c1,#396386),transparent);top:6%;left:-3%;animation:floatA 10s ease-in-out infinite}.shape-2{width:140px;height:140px;border:1px solid rgba(255,255,255,.25);transform:rotate(45deg);right:2%;top:20%;background:linear-gradient(135deg,var(--c2,#b3bcc0),transparent 75%);animation:floatB 13s ease-in-out infinite}.shape-3{width:210px;height:210px;border-radius:50%;bottom:-10%;right:-8%;background:radial-gradient(circle,var(--c4,#063139),transparent 68%);animation:floatC 14s ease-in-out infinite}.orbit{position:absolute;border:1px solid rgba(255,255,255,.09);border-radius:50%;pointer-events:none}.orbit-a{width:65vw;height:65vw;min-width:450px;min-height:450px;animation:spin 32s linear infinite}.orbit-b{width:90vw;height:90vw;min-width:640px;min-height:640px;animation:spinReverse 44s linear infinite}.spark{position:absolute;font-size:40px;line-height:1;z-index:3;color:var(--spark,#fff);filter:drop-shadow(0 8px 18px rgba(0,0,0,.12));animation:twinkle 3.2s ease-in-out infinite}.spark-a{right:10%;top:24%;animation-delay:.35s}.spark-b{left:9%;bottom:21%;font-size:34px;animation-delay:1.2s}
.bottom-bar{gap:12px}.pill{border:1px solid var(--line);background:rgba(0,0,0,.1);backdrop-filter:blur(15px);border-radius:999px;padding:10px 15px;font-size:10px;letter-spacing:.18em;cursor:pointer;min-width:90px}.shuffle{border:1px solid rgba(255,255,255,.42);background:rgba(255,255,255,.1);backdrop-filter:blur(15px);width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-size:26px;cursor:pointer;transition:transform .25s var(--ease)}
.drawer,.image-modal{position:fixed;inset:0;z-index:20;pointer-events:none;opacity:0;transition:opacity .35s ease}.drawer.open,.image-modal.open{pointer-events:auto;opacity:1}.drawer-backdrop,.modal-backdrop{position:absolute;inset:0;background:rgba(4,6,10,.45);backdrop-filter:blur(8px)}.drawer-panel,.modal-card{position:absolute;left:0;right:0;bottom:0;background:rgba(18,22,29,.94);backdrop-filter:blur(25px);border-top:1px solid rgba(255,255,255,.12);border-radius:28px 28px 0 0;padding:18px 18px max(22px,env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .45s var(--ease);max-height:min(80svh,760px);overflow:auto}.drawer.open .drawer-panel,.image-modal.open .modal-card{transform:translateY(0)}.drawer-head,.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.drawer-title{font-size:11px;letter-spacing:.22em;color:rgba(255,255,255,.65)}.close-btn{border:0;background:transparent;width:38px;height:38px;font-size:26px;color:rgba(255,255,255,.75)}.saved-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.saved-item{border:1px solid rgba(255,255,255,.10);border-radius:20px;overflow:hidden;background:rgba(255,255,255,.035);cursor:pointer}.saved-preview{height:120px}.saved-info{padding:12px}.saved-info strong{display:block;font-family:"Iowan Old Style","Songti SC",serif;font-size:16px;font-weight:500}.saved-info span{font-size:9px;opacity:.62;letter-spacing:.08em}.empty{padding:54px 0;text-align:center;color:rgba(255,255,255,.35);font-size:12px;letter-spacing:.12em}
.dropzone{min-height:160px;border:1px dashed rgba(255,255,255,.24);border-radius:22px;display:grid;place-items:center;align-content:center;gap:8px;color:rgba(255,255,255,.75);font-size:12px;cursor:pointer;background:rgba(255,255,255,.025)}.dropzone.drag{background:rgba(255,255,255,.06)}.dropzone input{display:none}.drop-symbol{font-size:34px}.preview-wrap{display:none;margin-top:14px;border-radius:20px;overflow:hidden;border:1px solid rgba(255,255,255,.09)}.preview-wrap img{display:block;width:100%;max-height:260px;object-fit:cover}.extracted{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:14px}.apply-btn{display:none;width:100%;margin-top:14px;border:0;border-radius:999px;padding:14px;background:#f5f0e8;color:#171b21;font-size:11px;letter-spacing:.18em;cursor:pointer}
@keyframes fadePop{0%{opacity:.45;transform:scale(.985)}100%{opacity:1;transform:scale(1)}}@keyframes floatA{50%{transform:translate(24px,36px) rotate(22deg)}}@keyframes floatB{50%{transform:translate(-20px,28px) rotate(80deg)}}@keyframes floatC{50%{transform:translate(-25px,-28px) scale(1.06)}}@keyframes twinkle{0%,100%{opacity:.5;transform:scale(.92) rotate(0)}50%{opacity:1;transform:scale(1.08) rotate(12deg)}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes spinReverse{to{transform:rotate(-360deg)}}
@media(min-width:780px){.app{padding:24px 28px 24px}.gallery{margin:10px 0 18px}.saved-grid{grid-template-columns:repeat(4,minmax(0,1fr))}.modal-card,.drawer-panel{left:50%;right:auto;width:min(640px,94vw);transform:translate(-50%,100%);border-left:1px solid rgba(255,255,255,.08);border-right:1px solid rgba(255,255,255,.08)}.drawer.open .drawer-panel,.image-modal.open .modal-card{transform:translate(-50%,0)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="ambient" aria-hidden="true"></div>
<main class="app">
<header class="topbar"><button class="wordmark" id="logoBtn">COLOR<span>·</span></button><nav class="actions"><button class="icon-btn" id="savedBtn" title="收藏">♡</button><button class="icon-btn" id="imageBtn" title="从图片取色">⌘</button></nav></header>
<section class="gallery" id="gallery"><div class="orbit orbit-a"></div><div class="orbit orbit-b"></div><div class="shape shape-1"></div><div class="shape shape-2"></div><div class="shape shape-3"></div><div class="spark spark-a">✦</div><div class="spark spark-b">✦</div><div class="specimen"><div class="eyebrow" id="paletteIndex">001 / GRADIENT</div><h1 id="paletteName">Warm Flame</h1><div class="tagline" id="paletteLine">soft light, held in the air</div><div class="color-bar" id="colorBar"></div><div class="swatches" id="swatches"></div><div class="meta-row"><div class="tiny">HEX</div><div class="meta-value" id="heroHex">#FF9A9E</div></div></div></section>
<footer class="bottom-bar"><button class="pill" id="paletteBtn">PALETTE</button><button class="shuffle" id="shuffleBtn" aria-label="随机">↻</button><button class="pill" id="gradientBtn">GRADIENT</button></footer>
</main>
<section class="drawer" id="drawer" aria-hidden="true"><div class="drawer-backdrop" id="drawerBackdrop"></div><div class="drawer-panel"><div class="drawer-head"><div class="drawer-title">SAVED</div><button class="close-btn" id="closeDrawer">×</button></div><div class="saved-grid" id="savedGrid"></div><div class="empty" id="savedEmpty">还没有收藏</div></div></section>
<section class="image-modal" id="imageModal" aria-hidden="true"><div class="modal-backdrop" id="modalBackdrop"></div><div class="modal-card"><div class="modal-head"><div class="drawer-title">FROM IMAGE</div><button class="close-btn" id="closeModal">×</button></div><label class="dropzone" id="dropzone"><input id="imageInput" type="file" accept="image/png,image/jpeg,image/webp,image/gif"><span class="drop-symbol">✦</span><span>选择一张图片</span></label><div class="preview-wrap" id="previewWrap"><img id="preview" alt="图片预览"></div><div class="extracted" id="extracted"></div><button class="apply-btn" id="applyExtracted">使用这组颜色</button></div></section>
<script>
const P=[{n:'Warm Flame',l:'soft light, held in the air',d:45,c:['#ff9a9e','#fad0c4']},{n:'Night Fade',l:'pink dissolving into violet',d:0,c:['#a18cd1','#fbc2eb']},{n:'Spring Warmth',l:'a little warmth after rain',d:0,c:['#fad0c4','#ffd1ff']},{n:'Juicy Peach',l:'quiet fruit in morning light',d:90,c:['#ffecd2','#fcb69f']},{n:'Young Passion',l:'heat that keeps moving',d:90,c:['#ff8177','#ff8c7f','#cf556c','#b12a5b']},{n:'Lady Lips',l:'softness with a pulse',d:0,c:['#ff9a9e','#fecfef']},{n:'Sunny Morning',l:'first light on a warm wall',d:120,c:['#f6d365','#fda085']},{n:'Rainy Ashville',l:'the sky after the noise',d:0,c:['#fbc2eb','#a6c1ee']},{n:'Frozen Dreams',l:'cold glass, pale air',d:0,c:['#fdcbf1','#e6dee9']},{n:'Winter Neva',l:'blue water under snow',d:120,c:['#a1c4fd','#c2e9fb']},{n:'Dusty Grass',l:'green softened by time',d:120,c:['#d4fc79','#96e6a1']},{n:'Tempting Azure',l:'water meeting spring',d:120,c:['#84fab0','#8fd3f4']},{n:'Heavy Rain',l:'everything turns quieter',d:0,c:['#cfd9df','#e2ebf0']},{n:'Amy Crisp',l:'blue, then suddenly coral',d:120,c:['#a6c0fe','#f68084']},{n:'Mean Fruit',l:'sweetness with a shadow',d:120,c:['#fccb90','#d57eeb']},{n:'Lilac Sky',l:'the last color before sleep',d:120,c:['#e0c3fc','#8ec5fc']},{n:'Ripe Malinka',l:'bright fruit in deep light',d:120,c:['#f093fb','#f5576c']},{n:'Cloudy Knoxville',l:'paper, fog, winter light',d:120,c:['#fdfbfb','#ebedee']},{n:'Malibu Beach',l:'sunlight on salt water',d:0,c:['#4facfe','#00f2fe']},{n:'New Life',l:'green electricity',d:0,c:['#43e97b','#38f9d7']},{n:'True Sunset',l:'the horizon catches fire',d:0,c:['#fa709a','#fee140']},{n:'Morpheus Den',l:'blue sinking into velvet',d:0,c:['#30cfd0','#330867']},{n:'Rare Wind',l:'air with a little blush',d:0,c:['#a8edea','#fed6e3']},{n:'Near Moon',l:'teal drifting through lilac',d:0,c:['#5ee7df','#b490ca']},{n:'Wild Apple',l:'something sweet, almost white',d:0,c:['#d299c2','#fef9d7']},{n:'Saint Petersburg',l:'winter light on stone',d:135,c:['#f5f7fa','#c3cfe2']},{n:"Arielle's Smile",l:'a clear blue afternoon',d:0,c:['#16d9e3','#30c7ec','#46aef7']},{n:'Plum Plate',l:'violet with weight',d:135,c:['#667eea','#764ba2']},{n:'Everlasting Sky',l:'cream under cold daylight',d:135,c:['#fdfcfb','#e2d1c3']},{n:'Happy Fisher',l:'bright water, open sky',d:120,c:['#89f7fe','#66a6ff']}];
const $=s=>document.querySelector(s),g=$('#gallery'),name=$('#paletteName'),line=$('#paletteLine'),idx=$('#paletteIndex'),bar=$('#colorBar'),sw=$('#swatches'),hero=$('#heroHex'),drawer=$('#drawer'),modal=$('#imageModal');let cur=P[0],saved=JSON.parse(localStorage.getItem('color-saved')||'[]'),imgCols=[];
function lum(h){h=h.replace('#','');let r=parseInt(h.slice(0,2),16)/255,gr=parseInt(h.slice(2,4),16)/255,b=parseInt(h.slice(4,6),16)/255;let f=x=>x<=.03928?x/12.92:((x+.055)/1.055)**2.4;return .2126*f(r)+.7152*f(gr)+.0722*f(b)}function txt(h){return lum(h)>.53?'#17212b':'#fff'}function grad(c,d=0){return`linear-gradient(${d}deg,${c.map((x,i)=>`${x} ${Math.round(i/(c.length-1||1)*100)}%`).join(',')})`}function vars(c){let [a,b,x,y]=[...c,...c].slice(0,4);document.documentElement.style.setProperty('--c1',a);document.documentElement.style.setProperty('--c2',b);document.documentElement.style.setProperty('--c3',x);document.documentElement.style.setProperty('--c4',y);document.documentElement.style.setProperty('--spark',txt(a)==='#fff'?'#fff':'#14202a')}
function render(p){cur=p;let i=P.indexOf(p);idx.textContent=`${String(i<0?1:i+1).padStart(3,'0')} / ${p.c.length>2?'PALETTE':'GRADIENT'}`;name.textContent=p.n;line.textContent=p.l;hero.textContent=p.c[0].toUpperCase();bar.style.background=grad(p.c,p.d);sw.innerHTML='';p.c.forEach(c=>{let s=document.createElement('button');s.className='swatch';s.style.background=c;s.style.setProperty('--swatch-text',txt(c));s.innerHTML=`<span class="code">${c.toUpperCase()}</span>`;s.onclick=()=>navigator.clipboard?.writeText(c);sw.appendChild(s)});vars(p.c);g.classList.remove('changing');void g.offsetWidth;g.classList.add('changing')}
function randName(){let a=['Quiet','Soft','Velvet','Silver','Electric','Blue','After','Distant','Hidden','Glass','Late','Pale','Tender','Midnight','Summer'],b=['Rain','Sea','Ember','Dream','Mist','Light','Garden','Hour','Sky','Echo','Bloom','Moon','Current','Dust','Heat'];return a[Math.random()*a.length|0]+' '+b[Math.random()*b.length|0]}function gen(){let h=Math.random()*360,sp=18+Math.random()*80,l=34+Math.random()*26,s=45+Math.random()*38;let c=[`hsl(${h} ${s}% ${l}%)`,`hsl(${(h+sp)%360} ${s*.82}% ${Math.min(78,l+12)}%)`,`hsl(${(h+sp*2)%360} ${s*.62}% ${Math.min(90,l+28)}%)`,`hsl(${(h+332)%360} ${s*.34}% ${Math.min(94,l+40)}%)`];let can=document.createElement('canvas').getContext('2d');c=c.map(v=>{can.fillStyle=v;let r=can.fillStyle.match(/\d+/g);return`#${r.slice(0,3).map(x=>(+x).toString(16).padStart(2,'0')).join('')}`});return{n:randName(),l:'a small accident in the color field',d:Math.random()*360|0,c}}
function random(){render(Math.random()<.72?P[Math.random()*P.length|0]:gen())}function savedNow(){return saved.some(x=>x.c.join('|')===cur.c.join('|'))}function toggleSave(){let i=saved.findIndex(x=>x.c.join('|')===cur.c.join('|'));if(i<0)saved.unshift(cur);else saved.splice(i,1);saved=saved.slice(0,24);localStorage.setItem('color-saved',JSON.stringify(saved));renderSaved()}function renderSaved(){let grid=$('#savedGrid');grid.innerHTML='';$('#savedEmpty').style.display=saved.length?'none':'block';saved.forEach(p=>{let e=document.createElement('div');e.className='saved-item';e.innerHTML=`<div class="saved-preview" style="background:${grad(p.c,p.d||0)}"></div><div class="saved-info"><strong>${p.n}</strong><span>${p.c[0]} · ${p.c.length} COLORS</span></div>`;e.onclick=()=>{render(p);closeDrawer()};grid.appendChild(e)})}function openDrawer(){renderSaved();drawer.classList.add('open');drawer.setAttribute('aria-hidden','false')}function closeDrawer(){drawer.classList.remove('open');drawer.setAttribute('aria-hidden','true')}function openModal(){modal.classList.add('open');modal.setAttribute('aria-hidden','false')}function closeModal(){modal.classList.remove('open');modal.setAttribute('aria-hidden','true')}
$('#shuffleBtn').onclick=random;$('#logoBtn').onclick=random;$('#paletteBtn').onclick=random;$('#gradientBtn').onclick=()=>{let a=random(),b=random();render({...a,c:[a.c[0],b.c[b.c.length-1]]})};$('#savedBtn').onclick=()=>{toggleSave();openDrawer()};$('#closeDrawer').onclick=closeDrawer;$('#drawerBackdrop').onclick=closeDrawer;$('#imageBtn').onclick=openModal;$('#closeModal').onclick=closeModal;$('#modalBackdrop').onclick=closeModal;
const input=$('#imageInput'),drop=$('#dropzone'),preview=$('#preview'),wrap=$('#previewWrap'),ext=$('#extracted'),apply=$('#applyExtracted');input.onchange=e=>e.target.files?.[0]&&extract(e.target.files[0]);['dragenter','dragover'].forEach(v=>drop.addEventListener(v,e=>{e.preventDefault();drop.classList.add('drag')}));['dragleave','drop'].forEach(v=>drop.addEventListener(v,e=>{e.preventDefault();drop.classList.remove('drag')}));drop.addEventListener('drop',e=>e.dataTransfer.files?.[0]&&extract(e.dataTransfer.files[0]));
function extract(file){let u=URL.createObjectURL(file);preview.src=u;wrap.style.display='block';let im=new Image();im.onload=()=>{imgCols=km(im,5);ext.innerHTML='';imgCols.forEach(c=>{let s=document.createElement('div');s.className='swatch';s.style.background=c;s.style.setProperty('--swatch-text',txt(c));s.innerHTML=`<span class="code">${c.toUpperCase()}</span>`;ext.appendChild(s)});apply.style.display='block'};im.src=u}
function km(im,k){let cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true}),m=180,r=Math.min(1,m/Math.max(im.naturalWidth,im.naturalHeight));cv.width=Math.max(1,im.naturalWidth*r|0);cv.height=Math.max(1,im.naturalHeight*r|0);cx.drawImage(im,0,0,cv.width,cv.height);let d=cx.getImageData(0,0,cv.width,cv.height).data,pts=[];for(let i=0;i<d.length;i+=4){if(d[i+3]<180)continue;let R=d[i],G=d[i+1],B=d[i+2];if(R>248&&G>248&&B>248)continue;pts.push([R,G,B])}if(!pts.length)return['#fff'];let cs=[pts[Math.random()*pts.length|0].slice()];while(cs.length<k){let bp=pts[0],bd=-1;for(let p of pts){let q=Math.min(...cs.map(c=>(p[0]-c[0])**2+(p[1]-c[1])**2+(p[2]-c[2])**2));if(q>bd){bd=q;bp=p}}cs.push(bp.slice())}for(let it=0;it<10;it++){let sum=Array.from({length:k},()=>[0,0,0,0]);for(let p of pts){let bi=0,bd=1e99;for(let j=0;j<k;j++){let c=cs[j],q=(p[0]-c[0])**2+(p[1]-c[1])**2+(p[2]-c[2])**2;if(q<bd){bd=q;bi=j}}let s=sum[bi];s[0]+=p[0];s[1]+=p[1];s[2]+=p[2];s[3]++}for(let j=0;j<k;j++)if(sum[j][3])cs[j]=sum[j].slice(0,3).map(v=>Math.round(v/sum[j][3]))}return cs.map(c=>`#${c.map(v=>v.toString(16).padStart(2,'0')).join('')}`).sort((a,b)=>lum(b)-lum(a))}
apply.onclick=()=>{if(imgCols.length){render({n:'From Image',l:'colors kept from a single moment',d:90,c:imgCols});closeModal()}};
render(cur);renderSaved();
</script>
</body></html>
